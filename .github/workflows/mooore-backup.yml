# ムーア用: 週1回、DB（pg_dump）と Supabase Storage の中身を Cloudflare R2 に書き出す。
# Secrets（GitHub の Settings → Secrets に登録。値は 1Password の Dev から）:
#   BACKUP_DB_URL        Supabase の「Session pooler」接続文字列（直接接続は IPv6 のみで Actions から繋がらない）
#   BACKUP_PASSPHRASE    ダンプを暗号化する合言葉
#   SB_S3_ENDPOINT / SB_S3_ACCESS_KEY_ID / SB_S3_SECRET_ACCESS_KEY / SB_S3_BUCKET   Supabase Storage（S3 互換）
#   R2_ENDPOINT / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET               バックアップ先
name: mooore-backup
on:
  schedule:
    - cron: "0 18 * * 0" # 日曜 18:00 UTC = 月曜 03:00 JST
  workflow_dispatch:
jobs:
  backup:
    # fork 元の Documenso では動かさない
    if: github.repository_owner != 'documenso'
    runs-on: ubuntu-latest
    steps:
      - name: Install clients
        run: |
          # Supabase は Postgres 17。pg_dump はサーバーと同じかそれ以上のバージョンが必要（Ubuntu 標準の 16 では失敗する）
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 rclone
      - name: Dump DB (encrypted)
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          D=$(date -u +%Y%m%d)
          # public スキーマだけ: Documenso のデータはすべてここ。auth など Supabase 管理のスキーマは新しいプロジェクトに最初からある
          pg_dump "$BACKUP_DB_URL" --schema=public --no-owner --no-acl --format=custom \
            | openssl enc -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE -out "db-$D.dump.enc"
          echo "D=$D" >> "$GITHUB_ENV"
      - name: Upload dump and mirror storage to R2
        env:
          RCLONE_CONFIG_SB_TYPE: s3
          RCLONE_CONFIG_SB_PROVIDER: Other
          RCLONE_CONFIG_SB_REGION: ap-northeast-1
          RCLONE_CONFIG_SB_FORCE_PATH_STYLE: "true"
          RCLONE_CONFIG_SB_ENDPOINT: ${{ secrets.SB_S3_ENDPOINT }}
          RCLONE_CONFIG_SB_ACCESS_KEY_ID: ${{ secrets.SB_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SB_SECRET_ACCESS_KEY: ${{ secrets.SB_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          # バケット限定のトークンはバケットの作成・確認ができない。確認を省かないと AccessDenied になる
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          rclone copyto "db-$D.dump.enc" "R2:${{ secrets.R2_BUCKET }}/db/db-$D.dump.enc"
          # sync ではなく copy: 元で消えたファイルがバックアップからも消えるのを避ける
          rclone copy "SB:${{ secrets.SB_S3_BUCKET }}" "R2:${{ secrets.R2_BUCKET }}/files"
